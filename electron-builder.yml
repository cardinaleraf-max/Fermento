appId: com.fermento.app
npmRebuild: false
afterPack: scripts/after-pack-fuses.cjs
productName: Fermento
publish:
  provider: generic
  url: https://updates.fermento-software.it/prod
  channel: latest
releaseInfo:
  releaseNotesFile: RELEASE_NOTES.md
directories:
  buildResources: build
  output: release
asar: true
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
# Solo ciò che serve all'app (electron-builder aggiunge da solo package.json e le
# dipendenze di produzione). Prima entrava tutta la cartella del progetto:
# documenti interni, test, note di lavoro e una vecchia build non offuscata.
files:
  - out/**
  - resources/**
  - '!resources/demo/**'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  executableName: fermento
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fermento
  uninstallDisplayName: Fermento
  artifactName: Fermento-${version}-setup.${ext}
mac:
  target:
    - target: zip
      arch: x64
  icon: resources/icon-512.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: Fermento-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Fermento
  category: Office
appImage:
  artifactName: Fermento-${version}.${ext}
