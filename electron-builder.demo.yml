# Versione demo (npm run build:win:demo / build:mac:demo).
# App separata da Fermento: altro appId, altro nome, altra cartella dati.
# Niente canale di aggiornamento: la demo si scarica sempre dallo stesso link.
appId: com.fermento.app.demo
npmRebuild: false
afterPack: scripts/after-pack-fuses.cjs
productName: Fermento Demo
# nessun canale di aggiornamento (niente app-update.yml nel pacchetto)
publish: null
directories:
  buildResources: build
  output: release
asar: true
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
# Database di esempio generato da scripts/genera-seed-demo.ts
extraResources:
  - from: resources/demo/fermento-demo-seed.db
    to: demo/fermento-demo-seed.db
# Solo ciò che serve all'app (electron-builder aggiunge da solo package.json e le
# dipendenze di produzione). Prima entrava tutta la cartella del progetto:
# documenti interni, test, note di lavoro e una vecchia build non offuscata.
files:
  - out/**
  - resources/**
  - '!resources/demo/**'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  executableName: fermento-demo
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fermento Demo
  uninstallDisplayName: Fermento Demo
  artifactName: Fermento-Demo-setup.${ext}
mac:
  target:
    - target: zip
      arch: x64
  icon: resources/icon-512.png
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Fermento-Demo-mac.${ext}
  notarize: false
